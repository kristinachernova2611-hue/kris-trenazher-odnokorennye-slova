:root{--navy:#24418F;--green:#10C98F;--green2:#0A9E70;--blue:#1FA8E8;--red:#E8194B;--purple:#7B3FC4;--yellow:#FFD43B;--soft:#F2F7FF;--border:#D5E1F5;--ok:#2BB673;--okbg:#E3F8EC;--warn:#FFF4D6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:N,"Segoe UI",Arial,sans-serif;color:var(--navy);background:var(--green);font-size:22px;line-height:1.3}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:18px;margin-bottom:12px}
.bar{flex:1;height:14px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:10px;transition:width .4s}
.stops{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stops span{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:800;padding:6px 4px;border-radius:20px;background:rgba(255,255,255,.3);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stops span.on{background:#fff;color:var(--green2)}
.stops span.done{background:var(--yellow);color:var(--navy)}
.card{background:#fff;border-radius:28px;padding:20px 18px 24px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.head{display:flex;gap:12px;align-items:flex-end;min-height:120px}
.kris{width:110px;height:130px;object-fit:contain;object-position:bottom;flex:none}
.say{flex:1;background:var(--soft);border-radius:22px;padding:14px 16px;font-weight:800;font-size:22px;position:relative;margin-bottom:12px}
.say::after{content:'';position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--soft);border-left:0}
.say.ok{background:var(--okbg)}.say.ok::after{border-right-color:var(--okbg)}
.say.hint{background:var(--warn)}.say.hint::after{border-right-color:var(--warn)}
.q{font-size:26px;font-weight:900;margin:18px 0 6px;text-align:center}
.big{font-size:40px;font-weight:900;text-align:center;margin:6px 0 14px;letter-spacing:1px;word-break:break-word}
.stmt{font-size:28px;font-weight:900;text-align:center;background:var(--soft);border-radius:20px;padding:18px;margin:10px 0 16px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.btn,.opt{font-family:inherit;font-weight:900;color:var(--navy);background:#fff;border:4px solid var(--border);border-radius:20px;min-height:60px;min-width:60px;padding:10px 20px;font-size:26px;cursor:pointer;box-shadow:0 5px 0 #E3EBF8;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:#E6F6FD}
.opt.good{border-color:var(--ok);background:var(--okbg);color:#137A47}
.opt.bad{border-color:#F2A5B6;background:#FFF0F3;animation:shake .35s}
.opt.done{opacity:.45;pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.main{display:block;width:100%;margin-top:18px;background:var(--blue);color:#fff;border:none;box-shadow:0 6px 0 #1585BA;font-size:26px;min-height:64px;border-radius:22px}
.main.alt{background:#fff;color:var(--navy);border:4px solid var(--border);box-shadow:0 6px 0 #E3EBF8}
.main.green{background:var(--ok);box-shadow:0 6px 0 #1E8F59}
.word{font-size:40px;font-weight:900;text-align:center;margin:14px 0;letter-spacing:2px}
.gap{display:inline-block;min-width:46px;border-bottom:5px solid var(--navy);color:var(--blue);text-align:center}
.r{position:relative;display:inline-block}
.r::before{content:'';position:absolute;left:-.03em;right:-.03em;top:-.12em;height:.42em;border:.09em solid var(--red);border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0}
.arcw{padding-top:14px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:12px}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pairs .opt{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;margin:12px 0;padding:10px;border-radius:20px;background:var(--soft)}
.chip{touch-action:none}
.baskets{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.basket{min-width:0;border:4px dashed #8FA8DA;border-radius:22px;min-height:170px;padding:10px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.basket .bt{font-size:24px;font-weight:900;text-align:center}
.basket .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.basket .in span{background:var(--okbg);border-radius:14px;padding:4px 10px;font-weight:800;font-size:19px;color:#137A47}
.basket.hov,.slot.hov{border-color:var(--blue);background:#E6F6FD}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.slot{display:flex;align-items:center;gap:10px;border:4px dashed #8FA8DA;border-radius:20px;min-height:64px;padding:8px 12px;font-weight:800;font-size:20px;background:#fff;cursor:pointer}
.slot b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.slot.full{border-style:solid;border-color:var(--ok);background:var(--okbg);color:#137A47}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 12px 24px rgba(0,0,0,.2)}
.order .opt{font-size:20px;text-align:left;width:100%}
.center{text-align:center}
.title{font-size:34px;font-weight:900;text-align:center;margin:8px 0}
.sub{font-size:22px;font-weight:700;text-align:center;color:#4A63A8}
.heroimg{display:block;margin:6px auto;height:220px;max-width:100%;object-fit:contain}
.stars{font-size:64px;text-align:center;letter-spacing:6px;margin:6px 0}
.stars .off{opacity:.2;filter:grayscale(1)}
.shot{background:var(--warn);border-radius:20px;padding:14px;font-weight:900;text-align:center;margin-top:14px;font-size:22px}
.tf{display:flex;gap:14px;justify-content:center}
.tf .opt{flex:1;max-width:240px;font-size:28px}
@media (max-width:380px){.baskets{grid-template-columns:1fr}.basket{min-height:110px}}
@media (max-width:420px){
 body{font-size:20px}.q{font-size:23px}.big,.word{font-size:34px}.opt,.btn{font-size:22px;padding:10px 14px}
 .kris{width:88px;height:108px}.say{font-size:19px}.stops span{font-size:12px}.order .opt{font-size:18px}
 .baskets{gap:8px}.title{font-size:27px}.basket .in span{font-size:16px;padding:4px 8px}.basket{padding:8px 4px}.basket .bt{font-size:20px}.pairs{gap:10px 12px}.heroimg{height:180px}
}
</style>
</head>

var CONGRATS=['Тропинка пройдена! Ты отлично находишь родственные слова!','Ура! Пещера корней пройдена! Корни тебе не страшны!','Мост пройден! Ни один обманщик тебя не провёл!'];
var T=[
 {s:0,type:'choice',q:'Выбери слово, родственное слову',big:'ЗИМА',opts:['зимний','замок','змея'],a:'зимний',hint:'Родственные слова близки по смыслу и имеют общую часть.'},
 {s:0,type:'tf',q:'Верно или неверно?',stmt:'«Рыба» и «рыбак» — родственные слова.',a:true,hint:'Рыбак ловит рыбу: смысл близкий и общая часть есть.'},
 {s:0,type:'tf',q:'Верно или неверно?',stmt:'«Море» и «морковь» — родственные слова.',a:false,hint:'Похожая часть есть, а смысл совсем разный.'},
 {s:0,type:'pairs',q:'Соедини родственные слова: нажми на пару.',pairs:[['дождь','дождик'],['гусь','гусёнок'],['мышь','мышонок'],['звон','звонкий']],hint:'Ищи пару с общей частью и близким смыслом.'},
 {s:1,type:'choice',q:'Выбери общую часть этих слов.',big:'чай · чайник · чайный',opts:['чай','чайн','ча'],a:'чай',hint:'Общая часть есть в каждом слове целиком.'},
 {s:1,type:'letter',q:'Вставь пропущенную букву в корень.',helper:'мороз',pre:'моро',post:'ный',opts:['з','с','ж'],a:'з',hint:'Корень у родственных слов одинаковый — посмотри на слово «мороз».'},
 {s:1,type:'tap',arcs:true,q:'Нажми на слово, где корень выделен неверно.',words:[['лунный',0,3],['зимний',0,3],['кошечка',0,5],['китёнок',0,3]],a:'кошечка',hint:'Подбери родственные слова и сравни общую часть: кошка, кошечка.'},
 {s:2,type:'tap',q:'Нажми на лишнее слово — не родственное.',words:['нос','носик','носатый','носилки'],a:'носилки',hint:'Похожая часть — ещё не родство. Подумай о смысле!'},
 {s:2,type:'tap',q:'Нажми на слово-обманщика.',words:['кот','котик','котлета','котёнок'],a:'котлета',hint:'Обманщик похож на остальные, но по смыслу с ними не связан.'},
 {s:2,type:'sort',q:'Разложи слова по корзинкам.',baskets:['💧 вода','🚗 водитель'],items:[['водный',0],['водичка',0],['подводный',0],['водить',1],['водительский',1]],hint:'Подумай: слово про воду или про то, как водят машину?'},
 {s:3,type:'tap',q:'Нажми на слово-родитель.',words:['цветочек','цветок','цветочный','цветочница'],a:'цветок',hint:'Слово-родитель — то, от которого образовались остальные слова.'},
 {s:3,type:'order',q:'Расставь шаги по порядку: как найти корень.',items:['Прочитай слово и подумай, что оно значит.','Подбери к нему родственные слова.','Найди у них общую часть.','Обозначь корень дугой.'],hint:'Сначала подумай о значении слова, а в конце обозначь корень.'},
 {s:3,type:'tf',q:'Верно или неверно?',stmt:'Корень — это общая часть родственных слов.',a:true,hint:'Вспомни правило: общая часть родственных слов называется корнем.'},
 {s:3,type:'sort',q:'Разложи слова по корзинкам.',baskets:['🌙 луна','☀️ солнце'],items:[['лунный',0],['луноход',0],['полнолуние',0],['солнышко',1],['подсолнух',1]],hint:'Подумай, о чём слово: о луне или о солнце.'}
];
var N=T.length, KEY='kris-trenazher-odnokorennye-v1';
var st=fresh();
function fresh(){return {phase:'start',i:0,first:{},review:[],rp:0,stopShown:-1};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v.i==='number')return v;}catch(e){}return null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function shuffleNot(a){if(a.length<2)return a.slice();var b;do{b=shuffle(a);}while(b.join('|')===a.join('|'));return b;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
var app=document.getElementById('app');
// preload
Object.keys(IMG).forEach(function(k){var im=new Image();im.src=IMG[k];});

function head(img,text,cls){return '<div class="head"><img class="kris" id="kimg" src="'+IMG[img]+'" alt="Лисёнок Крис"><div class="say '+(cls||'')+'" id="say">'+text+'</div></div>';}
function setKris(img,text,cls){var k=document.getElementById('kimg'),s=document.getElementById('say');if(k)k.src=IMG[img];if(s){s.className='say '+(cls||'');s.innerHTML=text;}}
function topbar(){
 var done=st.phase==='review'?st.rp:st.i;var tot=st.phase==='review'?st.review.length:N;
 var cur=st.phase==='review'?-1:T[st.i].s;
 var h='<div class="top"><span>'+(st.phase==='review'?'Работа над ошибками':'Задание '+(st.i+1)+' из '+N)+'</span><div class="bar"><i style="width:'+Math.round(done/tot*100)+'%"></i></div></div>';
 h+='<div class="stops">'+STOPS.map(function(n,k){var c=(st.phase==='review')?'done':(k<cur?'done':(k===cur?'on':''));return '<span class="'+c+'">'+n+'</span>';}).join('')+'</div>';
 return h;
}
var PRAISE=['Молодец!','Отлично!','Верно! Так держать!','Умница!','Правильно!','Супер!'];
function correct(){
 var img=Math.random()<.5?'happy':'praise';
 setKris(img,PRAISE[Math.floor(Math.random()*PRAISE.length)],'ok');
 var c=document.getElementById('task');
 var b=el('<button class="btn main green" id="next">Дальше →</button>');
 b.onclick=next;c.appendChild(b);
 setTimeout(function(){try{b.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},50);
}
var mistake=false;
function wrong(t){
 mistake=true;
 if(st.phase==='main'&&st.first[st.i]===undefined){st.first[st.i]=false;save();}
 setKris('think','Подумай ещё! '+t.hint,'hint');
}
function markFirst(){if(st.phase==='main'&&st.first[st.i]===undefined){st.first[st.i]=true;save();}}

function render(){
 window.scrollTo(0,0);
 if(st.phase==='start')return renderStart();
 if(st.phase==='stop')return renderStop();
 if(st.phase==='final')return renderFinal();
 renderTask();
}
function renderStart(){
 var saved=load();
 var cont=saved&&(saved.phase==='main'||saved.phase==='review'||saved.phase==='stop')&&(saved.i>0||saved.phase!=='main');
 app.innerHTML='<div class="card" style="margin-top:20px"><img class="heroimg" src="'+IMG.wave+'" alt="Лисёнок Крис"><div class="title">Привет! Я лисёнок Крис!</div>'+
 '<div class="sub">Отправляемся в путешествие по Стране слов! Нас ждут 4 остановки и '+N+' заданий про родственные слова.</div>'+
 (cont?'<button class="btn main green" id="cont">Продолжить путешествие</button>':'')+
 '<button class="btn main'+(cont?' alt':'')+'" id="go">'+(cont?'Начать сначала':'Начать путешествие!')+'</button></div>';
 if(cont)document.getElementById('cont').onclick=function(){st=saved;if(st.phase==='main'&&st.stopShown!==T[st.i].s){st.phase='main';}render();};
 document.getElementById('go').onclick=function(){st=fresh();st.phase='main';save();render();};
}
function renderStop(){
 var k=st.stopDone;
 app.innerHTML=topbar()+'<div class="card"><img class="heroimg" src="'+IMG.praise+'" alt="Крис хвалит"><div class="title">'+CONGRATS[k]+'</div><div class="sub">Впереди: '+STOPS_FULL[k+1]+'</div><button class="btn main" id="go">В путь!</button></div>';
 document.getElementById('go').onclick=function(){st.phase='main';save();render();};
}
function curTask(){return st.phase==='review'?T[st.review[st.rp]]:T[st.i];}
function renderTask(){
 var t=curTask();mistake=false;
 var intro='Нажми на ответ. Если ошибёшься — я подскажу!';
 if(st.phase==='main'&&st.stopShown!==t.s){intro=STOP_TEXT[t.s];st.stopShown=t.s;save();}
 if(st.phase==='review')intro='Давай попробуем ещё раз!';
 app.innerHTML=topbar()+'<div class="card" id="task">'+head('wave',intro)+'<div class="q">'+esc(t.q)+'</div><div id="body"></div></div>';
 var b=document.getElementById('body');
 ({choice:rChoice,tf:rTF,pairs:rPairs,letter:rLetter,tap:rTap,sort:rSort,order:rOrder})[t.type](t,b);
}
function lock(b){Array.prototype.forEach.call(b.querySelectorAll('.opt'),function(o){o.style.pointerEvents='none';});}
function rChoice(t,b){
 b.innerHTML='<div class="big">'+esc(t.big)+'</div><div class="opts"></div>';
 var o=b.querySelector('.opts');
 shuffleNot(t.opts).forEach(function(w){var x=el('<button class="opt" data-v="'+esc(w)+'">'+esc(w)+'</button>');
  x.onclick=function(){if(w===t.a){x.classList.add('good');markFirst();lock(b);correct();}else{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}};o.appendChild(x);});
}
function rTF(t,b){
 b.innerHTML='<div class="stmt">'+esc(t.stmt)+'</div><div class="tf"></div>';
 var o=b.querySelector('.tf');
 [[true,'✓ Верно'],[false,'✗ Неверно']].forEach(function(p){var x=el('<button class="opt" data-v="'+p[0]+'">'+p[1]+'</button>');
  x.onclick=function(){if(p[0]===t.a){x.classList.add('good');markFirst();lock(b);correct();}else{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}};o.appendChild(x);});
}
function rLetter(t,b){
 b.innerHTML='<div class="sub">Подсказка: '+esc(t.helper)+'</div><div class="word">'+esc(t.pre)+'<span class="gap" id="gap">&nbsp;</span>'+esc(t.post)+'</div><div class="opts"></div>';
 var o=b.querySelector('.opts'),g=b.querySelector('#gap');
 shuffleNot(t.opts).forEach(function(w){var x=el('<button class="opt" data-v="'+esc(w)+'" style="min-width:76px;font-size:32px">'+esc(w)+'</button>');
  x.onclick=function(){g.textContent=w;if(w===t.a){x.classList.add('good');g.style.color='var(--ok)';markFirst();lock(b);correct();}else{g.style.color='var(--red)';x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}};o.appendChild(x);});
}
function arc(w){return esc(w[0].slice(0,w[1]))+'<span class="r">'+esc(w[0].slice(w[1],w[2]))+'</span>'+esc(w[0].slice(w[2]));}
function rTap(t,b){
 b.innerHTML='<div class="opts"></div>';
 var o=b.querySelector('.opts');
 shuffleNot(t.words).forEach(function(w){var val=t.arcs?w[0]:w;var x=el('<button class="opt'+(t.arcs?' arcw':'')+'" data-v="'+esc(val)+'">'+(t.arcs?arc(w):esc(w))+'</button>');
  x.onclick=function(){if(val===t.a){x.classList.add('good');markFirst();lock(b);correct();}else{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}};o.appendChild(x);});
}
// ---- drag & tap helpers ----
var sel=null;
function selectChip(x){if(sel)sel.classList.remove('sel');sel=(sel===x)?null:x;if(sel)sel.classList.add('sel');}
function draggable(x,drop){
 x.addEventListener('click',function(e){if(e.detail===0)selectChip(x);});
 var sx,sy,drag=false,ghost=null,id=null,hov=null;
 x.addEventListener('pointerdown',function(e){if(x.classList.contains('done'))return;sx=e.clientX;sy=e.clientY;drag=false;id=e.pointerId;try{x.setPointerCapture(id);}catch(_){}});
 x.addEventListener('pointermove',function(e){if(id!==e.pointerId)return;
  if(!drag&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10){drag=true;ghost=x.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=x.offsetWidth+'px';document.body.appendChild(ghost);x.style.opacity='.4';}
  if(drag){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';var t=target(e);if(hov!==t){if(hov)hov.classList.remove('hov');hov=t;if(hov)hov.classList.add('hov');}}});
 function target(e){var d=document.elementFromPoint(e.clientX,e.clientY);return d&&d.closest?d.closest('[data-drop]'):null;}
 function end(e,cancel){if(id!==e.pointerId)return;id=null;
  if(drag){var t=cancel?null:target(e);if(ghost)ghost.remove();ghost=null;x.style.opacity='';if(hov)hov.classList.remove('hov');hov=null;drag=false;if(t)drop(x,t);}
  else if(!cancel){selectChip(x);}}
 x.addEventListener('pointerup',function(e){end(e,false);});
 x.addEventListener('pointercancel',function(e){end(e,true);});
}
function rSort(t,b){
 sel=null;
 b.innerHTML='<div class="sub">Перетащи слово или нажми на слово, потом на корзинку.</div><div class="chips"></div><div class="baskets">'+t.baskets.map(function(n,k){return '<div class="basket" data-drop="'+k+'"><div class="bt">'+esc(n)+'</div><div class="in"></div></div>';}).join('')+'</div>';
 var c=b.querySelector('.chips'),left=t.items.length;
 function put(x,bk){var k=+bk.getAttribute('data-drop');var it=t.items[+x.getAttribute('data-i')];
  if(it[1]===k){bk.querySelector('.in').appendChild(el('<span>'+esc(it[0])+'</span>'));x.remove();sel=null;left--;
   if(left===0){markFirst();setTimeout(correct,150);}else setKris('happy','Верно! Дальше!','ok');}
  else{x.classList.remove('sel');sel=null;x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}}
 shuffle(t.items.map(function(it,i){return i;})).forEach(function(i){var x=el('<button class="opt chip" data-i="'+i+'" data-v="'+esc(t.items[i][0])+'">'+esc(t.items[i][0])+'</button>');draggable(x,put);c.appendChild(x);});
 Array.prototype.forEach.call(b.querySelectorAll('.basket'),function(bk){bk.addEventListener('click',function(){if(sel)put(sel,bk);});});
}
function rOrder(t,b){
 sel=null;
 b.innerHTML='<div class="sub">Перетащи шаг в рамку или нажми на шаг, потом на рамку.</div><div class="chips order"></div><div class="slots">'+t.items.map(function(_,k){return '<div class="slot" data-drop="'+k+'"><b>'+(k+1)+'</b><span></span></div>';}).join('')+'</div>';
 var c=b.querySelector('.chips'),left=t.items.length;
 function put(x,sl){var k=+sl.getAttribute('data-drop');var i=+x.getAttribute('data-i');
  if(sl.classList.contains('full')){selectChip(x);return;}
  if(i===k){sl.classList.add('full');sl.querySelector('span').textContent=t.items[i];x.remove();sel=null;left--;
   if(left===0){markFirst();setTimeout(correct,150);}else setKris('happy','Верно! Какой шаг дальше?','ok');}
  else{x.classList.remove('sel');sel=null;x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');wrong(t);}}
 shuffleNot(t.items.map(function(_,i){return i;})).forEach(function(i){var x=el('<button class="opt chip" data-i="'+i+'">'+esc(t.items[i])+'</button>');draggable(x,put);c.appendChild(x);});
 Array.prototype.forEach.call(b.querySelectorAll('.slot'),function(sl){sl.addEventListener('click',function(){if(sel)put(sel,sl);});});
}
function rPairs(t,b){
 sel=null;
 b.innerHTML='<div class="sub">Нажми на слово слева, потом на пару справа.</div><div class="pairs"><div class="col" id="L"></div><div class="col" id="R"></div></div>';
 var L=b.querySelector('#L'),R=b.querySelector('#R'),left=t.pairs.length;
 function tryPair(x,y){var a=+x.getAttribute('data-i'),c=+y.getAttribute('data-i');
  if(a===c){x.classList.remove('sel');x.classList.add('good','done');y.classList.add('good','done');sel=null;left--;
   if(left===0){markFirst();setTimeout(correct,150);}else setKris('happy','Верно! Ищи следующую пару.','ok');}
  else{x.classList.remove('sel');sel=null;y.classList.remove('bad');void y.offsetWidth;y.classList.add('bad');wrong(t);}}
 shuffle(t.pairs.map(function(_,i){return i;})).forEach(function(i){var x=el('<button class="opt chip" data-i="'+i+'" data-side="L">'+esc(t.pairs[i][0])+'</button>');draggable(x,function(x,tg){tryPair(x,tg);});L.appendChild(x);});
 shuffleNot(t.pairs.map(function(_,i){return i;})).forEach(function(i){var y=el('<button class="opt" data-drop="r" data-i="'+i+'" data-side="R">'+esc(t.pairs[i][1])+'</button>');
  y.onclick=function(){if(y.classList.contains('done'))return;if(sel)tryPair(sel,y);else setKris('wave','Сначала нажми на слово в левом столбике.');};R.appendChild(y);});
}
function next(){
 if(st.phase==='review'){st.rp++;if(st.rp>=st.review.length){st.phase='final';st.reviewDone=true;}save();return render();}
 var s=T[st.i].s;st.i++;
 if(st.i>=N){st.phase='final';save();return render();}
 if(T[st.i].s!==s){st.phase='stop';st.stopDone=s;}
 save();render();
}
function renderFinal(){
 var ok=0;for(var i=0;i<N;i++)if(st.first[i]===true)ok++;
 var stars=ok>=12?3:(ok>=8?2:1);
 var errs=[];for(i=0;i<N;i++)if(st.first[i]!==true)errs.push(i);
 var sh='';for(i=0;i<3;i++)sh+='<span class="'+(i<stars?'':'off')+'">⭐</span>';
 app.innerHTML='<div class="card" style="margin-top:20px" id="final"><img class="heroimg" src="'+IMG.cheer+'" alt="Крис ликует"><div class="title">Ура! Мы нашли клад!</div>'+
  '<div class="stars" aria-label="Звёзд: '+stars+'">'+sh+'</div>'+
  '<div class="sub" style="font-size:26px;font-weight:900;color:var(--navy)">С первого раза: <span id="score">'+ok+'</span> из '+N+'</div>'+
  (st.reviewDone?'<div class="sub" style="margin-top:8px">Работа над ошибками выполнена! Молодец!</div>':'')+
  (errs.length&&!st.reviewDone?'<button class="btn main green" id="rev">Работа над ошибками ('+errs.length+')</button>':'')+
  '<div class="shot">📸 Сделай скриншот и отправь учителю</div>'+
  '<button class="btn main alt" id="again">Начать заново</button></div>';
 var r=document.getElementById('rev');
 if(r)r.onclick=function(){st.phase='review';st.review=shuffle(errs);st.rp=0;save();render();};
 document.getElementById('again').onclick=function(){st=fresh();st.phase='main';save();render();};
}
window.__kris={T:T,st:function(){return st;},cur:function(){return st.phase==='main'||st.phase==='review'?curTask():null;}};
render();
})();
</script>
</body>
</html>
